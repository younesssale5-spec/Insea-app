

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#153d60">
<title>INSEA Résidence</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f2f5f9;color:#1d2939;font-family:Arial,sans-serif}
header{background:#153d60;color:white;padding:24px 15px;text-align:center}
header h1{margin:0 0 8px}
main{max-width:700px;margin:20px auto;padding:0 14px}
.panel,.student{background:white;border-radius:14px;padding:16px;margin-bottom:15px}
input,button{font:inherit;padding:12px;border-radius:8px}
input{width:100%;border:1px solid #ccc;margin:7px 0 12px}
button{border:0;background:#153d60;color:white;cursor:pointer}
.secondary{background:#e5edf5;color:#153d60}
.danger{background:#b42318}
.toolbar,.actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.student{display:flex;gap:12px;align-items:center}
.student img{width:75px;height:75px;object-fit:cover;border-radius:10px}
.info{flex:1}
.info h3{margin:0 0 8px}
.info p{margin:5px 0;color:#667085}
label{display:block;font-weight:bold;font-size:14px}
.hidden{display:none!important}
.muted{color:#667085;font-size:14px}
</style>
</head>
<body>
<header>
<h1>INSEA Résidence</h1>
<p id="subtitle">Gestion et recherche des résidents</p>
</header>
<main>
<div class="toolbar">
<button class="secondary" id="langBtn">العربية</button>
<button id="adminBtn">Administration</button>
</div>
<section class="panel">
<h2 id="searchTitle">Recherche d'un étudiant</h2>
<label id="searchLabel">Nom, prénom ou numéro de chambre</label>
<input id="search" placeholder="Saisir un nom ou une chambre...">
<p id="count" class="muted"></p>
</section>
<section class="panel hidden" id="adminPanel">
<h2 id="formTitle">Ajouter un étudiant</h2>
<form id="studentForm">
<input type="hidden" id="editId">
<label id="firstLabel">Prénom</label>
<input id="firstName" required>
<label id="lastLabel">Nom</label>
<input id="lastName" required>
<label id="roomLabel">Numéro de chambre</label>
<input id="room" required>
<label id="floorLabel">Étage</label>
<input id="floor">
<label id="blockLabel">Bloc</label>
<input id="block">
<label id="photoLabel">Photo de l'étudiant</label>
<input id="photo" type="file" accept="image/*">
<button id="saveBtn" type="submit">Enregistrer</button>
<button id="cancelBtn" class="secondary" type="button">Annuler</button>
</form>
<button id="exportBtn" class="secondary">Exporter une sauvegarde</button>
</section>
<section id="results"></section>
</main>
</body>
  
<script>
const $ = id => document.getElementById(id);
const KEY = "insea_residence_students";
let students = [];
let admin = false;
let lang = "fr";
let photoData = "";

const words = {
 fr: {
  search:"Recherche d'un étudiant",
  label:"Nom, prénom ou numéro de chambre",
  placeholder:"Saisir un nom ou une chambre...",
  admin:"Administration",close:"Fermer l'administration",
  add:"Ajouter un étudiant",edit:"Modifier un étudiant",
  first:"Prénom",last:"Nom",room:"Numéro de chambre",
  floor:"Étage",block:"Bloc",photo:"Photo de l'étudiant",
  save:"Enregistrer",update:"Mettre à jour",cancel:"Annuler",
  change:"Modifier",del:"Supprimer",confirm:"Supprimer cet étudiant ?",
  empty:"Aucun étudiant trouvé.",count:"étudiant(s)",
  roomText:"Chambre",floorText:"Étage",blockText:"Bloc",
  password:"Mot de passe administrateur",wrong:"Mot de passe incorrect.",
  saved:"Étudiant enregistré.",deleted:"Étudiant supprimé.",
  lang:"العربية"
 },
 ar: {
  search:"البحث عن طالب",
  label:"الاسم أو اللقب أو رقم الغرفة",
  placeholder:"اكتب الاسم أو رقم الغرفة...",
  admin:"الإدارة",close:"إغلاق الإدارة",
  add:"إضافة طالب",edit:"تعديل طالب",
  first:"الاسم",last:"اللقب",room:"رقم الغرفة",
  floor:"الطابق",block:"البلوك",photo:"صورة الطالب",
  save:"حفظ",update:"تحديث",cancel:"إلغاء",
  change:"تعديل",del:"حذف",confirm:"هل تريد حذف هذا الطالب؟",
  empty:"لم يتم العثور على أي طالب.",count:"طالب",
  roomText:"الغرفة",floorText:"الطابق",blockText:"البلوك",
  password:"كلمة مرور الإدارة",wrong:"كلمة المرور غير صحيحة.",
  saved:"تم حفظ الطالب.",deleted:"تم حذف الطالب.",
  lang:"Français"
 }
};
function t(k){return words[lang][k]||k}

try {
 students=JSON.parse(localStorage.getItem(KEY)||"[]");
 if(!Array.isArray(students)) students=[];
} catch(e) { students=[]; }

function saveData(){
 try{
  localStorage.setItem(KEY,JSON.stringify(students));
  return true;
 }catch(e){
  alert("Stockage insuffisant. Choisissez une photo plus petite.");
  return false;
 }
}
function language(){
 document.documentElement.lang=lang;
 document.documentElement.dir=lang==="ar"?"rtl":"ltr";
 $("searchTitle").textContent=t("search");
 $("searchLabel").textContent=t("label");
 $("search").placeholder=t("placeholder");
 $("adminBtn").textContent=admin?t("close"):t("admin");
 $("langBtn").textContent=t("lang");
 $("formTitle").textContent=$("editId").value?t("edit"):t("add");
 $("firstLabel").textContent=t("first");
 $("lastLabel").textContent=t("last");
 $("roomLabel").textContent=t("room");
 $("floorLabel").textContent=t("floor");
 $("blockLabel").textContent=t("block");
 $("photoLabel").textContent=t("photo");
 $("saveBtn").textContent=$("editId").value?t("update"):t("save");
 $("cancelBtn").textContent=t("cancel");
 render();
}
function safe(s){
 return String(s||"").replace(/[&<>"']/g,c=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",
  '"':"&quot;","'":"&#39;"
 }[c]));
}
function render(){
 const q=$("search").value.trim().toLowerCase();
 const found=students.filter(s=>
  [s.first,s.last,s.room,s.floor,s.block]
   .some(v=>String(v||"").toLowerCase().includes(q))
 );
 $("count").textContent=found.length+" "+t("count");
 const results=$("results");
 results.replaceChildren();
 if(!found.length){
  const p=document.createElement("div");
  p.className="panel muted";
  p.textContent=t("empty");
  results.appendChild(p);
  return;
 }
 found.forEach(s=>{
  const card=document.createElement("article");
  card.className="student";
  if(s.photo){
   const img=document.createElement("img");
   img.src=s.photo;img.alt=t("photo");
   card.appendChild(img);
  }
  const info=document.createElement("div");
  info.className="info";
  const name=document.createElement("h3");
  name.textContent=s.first+" "+s.last;
  info.appendChild(name);
  [[t("roomText"),s.room],[t("floorText"),s.floor],
   [t("blockText"),s.block]].forEach(([label,value])=>{
    if(value){
     const p=document.createElement("p");
     p.textContent=label+": "+value;
     info.appendChild(p);
    }
   });
  if(admin){
   const actions=document.createElement("div");
   actions.className="actions";
   const edit=document.createElement("button");
   edit.textContent=t("change");
   edit.onclick=()=>editStudent(s.id);
   const del=document.createElement("button");
   del.className="danger";
   del.textContent=t("del");
   del.onclick=()=>deleteStudent(s.id);
   actions.append(edit,del);
   info.appendChild(actions);
  }
  card.appendChild(info);
  results.appendChild(card);
 });
}
function resetForm(){
 $("studentForm").reset();
 $("editId").value="";
 photoData="";
 language();
}
function editStudent(id){
 const s=students.find(x=>x.id===id);
 if(!s)return;
 $("editId").value=s.id;
 $("firstName").value=s.first;
 $("lastName").value=s.last;
 $("room").value=s.room;
 $("floor").value=s.floor||"";
 $("block").value=s.block||"";
 photoData=s.photo||"";
 language();
 $("adminPanel").classList.remove("hidden");
 window.scrollTo({top:0,behavior:"smooth"});
}
function deleteStudent(id){
 if(!confirm(t("confirm")))return;
 const old=students;
 students=students.filter(s=>s.id!==id);
 if(saveData()){
  render();alert(t("deleted"));
 }else students=old;
}
$("search").addEventListener("input",render);
$("langBtn").addEventListener("click",()=>{
 lang=lang==="fr"?"ar":"fr";
 language();
});
$("adminBtn").addEventListener("click",()=>{
 if(!admin){
  const pin=prompt(t("password"));
  if(pin===null)return;
  if(pin!=="1234"){alert(t("wrong"));return;}
 }
 admin=!admin;
 $("adminPanel").classList.toggle("hidden",!admin);
 if(!admin)resetForm();
 language();
});
$("cancelBtn").addEventListener("click",resetForm);

$("photo").addEventListener("change",e=>{
 const file=e.target.files[0];
 if(!file)return;
 const reader=new FileReader();
 reader.onload=()=>{
  const img=new Image();
  img.onload=()=>{
   const scale=Math.min(1,500/Math.max(img.width,img.height));
   const canvas=document.createElement("canvas");
   canvas.width=Math.round(img.width*scale);
   canvas.height=Math.round(img.height*scale);
   canvas.getContext("2d").drawImage(img,0,0,canvas.width,canvas.height);
   photoData=canvas.toDataURL("image/jpeg",0.7);
  };
  img.onerror=()=>alert("Image invalide.");
  img.src=reader.result;
 };
 reader.onerror=()=>alert("Impossible de lire la photo.");
 reader.readAsDataURL(file);
});

$("studentForm").addEventListener("submit",e=>{
 e.preventDefault();
 if(!admin)return;
 const id=$("editId").value||String(Date.now())+Math.random();
 const old=students;
 const previous=students.find(s=>s.id===id);
 const student={
  id,
  first:$("firstName").value.trim(),
  last:$("lastName").value.trim(),
  room:$("room").value.trim(),
  floor:$("floor").value.trim(),
  block:$("block").value.trim(),
  photo:photoData||(previous?previous.photo:"")
 };
 students=previous
  ?students.map(s=>s.id===id?student:s)
  :[student,...students];
 if(saveData()){
  resetForm();
  render();
  alert(t("saved"));
 }else students=old;
});

$("exportBtn").addEventListener("click",()=>{
 const blob=new Blob([JSON.stringify(students)],{type:"application/json"});
 const url=URL.createObjectURL(blob);
 const a=document.createElement("a");
 a.href=url;a.download="insea-backup.json";a.click();
 URL.revokeObjectURL(url);
});

language();
</script>

</html>
