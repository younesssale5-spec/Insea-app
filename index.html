<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INSEA Résidence</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f1f5f9;color:#172033}
header{background:#123b35;color:white;padding:22px 16px;text-align:center}
header h1{margin:0;font-size:23px}
header p{margin:8px 0 0;font-size:14px}
main{max-width:650px;margin:20px auto;padding:0 14px}
.panel{background:white;padding:18px;border-radius:12px;margin-bottom:16px;box-shadow:0 2px 8px #0000000c}
h2{font-size:18px;margin-top:0}
input,button{font:inherit}
input[type=text],input[type=password],input[type=file],input[type=number]{
width:100%;padding:12px;margin:6px 0 12px;border:1px solid #ccd5d3;border-radius:7px;background:white
}
label{font-size:14px;font-weight:bold}
button{border:0;border-radius:7px;padding:11px 14px;cursor:pointer}
.primary{background:#176b56;color:white;width:100%;font-weight:bold}
.secondary{background:#e4eee9;color:#174d3f}
.danger{background:#fee2e2;color:#991b1b}
.student{display:flex;gap:12px;align-items:center;border-bottom:1px solid #e5e7eb;padding:13px 0}
.student:last-child{border-bottom:0}
.student img{width:65px;height:65px;object-fit:cover;border-radius:9px;background:#e5e7eb}
.details{flex:1;min-width:0}
.details h3{margin:0 0 7px;font-size:16px;overflow-wrap:anywhere}
.details p{margin:4px 0;font-size:14px;color:#52616b}
.actions{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.actions button{font-size:13px;padding:8px}
.hidden{display:none}
#message{font-size:14px;margin-top:10px}
footer{text-align:center;color:#64748b;font-size:12px;padding:16px}
</style>
</head>
<body>
<header>
<h1>INSEA Résidence</h1>
<p>Gestion et recherche des résidents</p>
</header>

<main>
<section class="panel">
<h2>Rechercher un étudiant</h2>
<input id="search" type="text"
placeholder="Nom, prénom ou numéro de chambre"><button class="secondary" id="toggleList" type="button"
style="width:100%;margin-bottom:12px">
Afficher tous les étudiants
</button>

<div id="results"></div>
</section>

<section class="panel">
<h2 id="formTitle">Ajouter un étudiant</h2>
<form id="studentForm">
<input id="editId" type="hidden">

<label for="firstName">Prénom</label>
<input id="firstName" type="text" required maxlength="60">

<label for="lastName">Nom</label>
<input id="lastName" type="text" required maxlength="60">

<label for="room">Numéro de chambre</label>
<input id="room" type="text" required maxlength="30">

<label for="building">Bâtiment / Pavillon</label>
<input id="building" type="text" maxlength="60">

<label for="photo">Photo personnelle</label>
<input id="photo" type="file" accept="image/*">
<img id="preview" class="hidden" alt="Aperçu de la photo"
style="width:90px;height:90px;object-fit:cover;border-radius:8px;margin-bottom:12px">

<button class="primary" type="submit">Enregistrer l'étudiant</button>
<button class="secondary hidden" id="cancelEdit" type="button"
style="width:100%;margin-top:8px">Annuler la modification</button>
<p id="message" role="status"></p>
</form>
</section>

<section class="panel">
<h2>Liste des étudiants</h2>
<p id="count">0 étudiant</p>
<button class="secondary" id="exportBtn" type="button">
Exporter une sauvegarde JSON
</button>
<p style="font-size:12px;color:#64748b">
Les données sont enregistrées dans ce navigateur.
Exportez régulièrement une sauvegarde.
</p>
</section>
</main>

<footer>INSEA Résidence · Gestion des résidents</footer>

<script>
const KEY = "insea_residents_v1";
let students = [];
let currentPhoto = "";
let storageAvailable = true;

try {
  students = JSON.parse(localStorage.getItem(KEY) || "[]");
  if (!Array.isArray(students)) students = [];
} catch(e) {
  students = [];
  storageAvailable = false;
}

const $ = id => document.getElementById(id);
const form = $("studentForm");
let photoProcessing = Promise.resolve();

function save() {
  try {
    localStorage.setItem(KEY, JSON.stringify(students));
    storageAvailable = true;
    return true;
  } catch(e) {
    storageAvailable = false;
    $("message").textContent =
      "Stockage plein ou indisponible. Réduisez les photos, exportez une sauvegarde ou supprimez des données inutiles.";
    return false;
  }
}

let showAllStudents = false;

function render() {
  const query = $("search").value.trim().toLocaleLowerCase("fr");
  const filtered = students.filter(s =>
    [s.firstName, s.lastName, s.room, s.building]
      .some(v => (v || "").toLocaleLowerCase("fr").includes(query))
  );

  $("count").textContent = students.length + " étudiant(s)";
  $("results").replaceChildren();

  if (!query && !showAllStudents) {
    $("results").textContent =
      "Recherchez un étudiant ou affichez la liste complète.";
    return;
  }

  if (!filtered.length) {
    $("results").textContent = "Aucun étudiant trouvé.";
    return;
  }

  filtered.forEach(s => {
    const card = document.createElement("div");
    card.className = "student";

    const img = document.createElement("img");
    img.alt = "Photo de l'étudiant";
    if (s.photo) img.src = s.photo;

    const details = document.createElement("div");
    details.className = "details";

    const name = document.createElement("h3");
    name.textContent = s.firstName + " " + s.lastName;

    const room = document.createElement("p");
    room.textContent = "Chambre : " + s.room;
    details.append(name, room);

    if (s.building) {
      const building = document.createElement("p");
      building.textContent = "Bâtiment : " + s.building;
      details.append(building);
    }

    const actions = document.createElement("div");
    actions.className = "actions";

    const edit = document.createElement("button");
    edit.type = "button";
    edit.className = "secondary";
    edit.textContent = "Modifier";
    edit.addEventListener("click", () => editStudent(s.id));

    const del = document.createElement("button");
    del.type = "button";
    del.className = "danger";
    del.textContent = "Supprimer";
    del.addEventListener("click", () => deleteStudent(s.id));

    actions.append(edit, del);
    details.append(actions);
    card.append(img, details);
    $("results").append(card);
  });
}

$("toggleList").addEventListener("click", () => {
  showAllStudents = !showAllStudents;
  $("toggleList").textContent = showAllStudents
    ? "Masquer la liste des étudiants"
    : "Afficher tous les étudiants";
  render();
});

function resetForm() {
  form.reset();
  $("editId").value = "";
  $("formTitle").textContent = "Ajouter un étudiant";
  $("cancelEdit").classList.add("hidden");
  $("preview").classList.add("hidden");
  $("preview").removeAttribute("src");
  currentPhoto = "";
}

$("photo").addEventListener("change", () => {
  const file = $("photo").files[0];
  if (!file) return;

  if (!file.type.startsWith("image/")) {
    $("message").textContent = "Veuillez choisir une image.";
    $("photo").value = "";
    return;
  }

  if (file.size > 5 * 1024 * 1024) {
    $("message").textContent = "Photo trop volumineuse. Choisissez une image de moins de 5 Mo.";
    $("photo").value = "";
    return;
  }

  $("message").textContent = "Préparation de la photo…";
  photoProcessing = (async () => {
    try {
      const dataUrl = await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(new Error("Lecture impossible"));
        reader.readAsDataURL(file);
      });

      const img = await new Promise((resolve, reject) => {
        const image = new Image();
        image.onload = () => resolve(image);
        image.onerror = () => reject(new Error("Image illisible"));
        image.src = dataUrl;
      });

      const canvas = document.createElement("canvas");
      const maxSize = 480;
      const scale = Math.min(1, maxSize / Math.max(img.width, img.height));
      canvas.width = Math.max(1, Math.round(img.width * scale));
      canvas.height = Math.max(1, Math.round(img.height * scale));

      const ctx = canvas.getContext("2d");
      if (!ctx) throw new Error("Canvas indisponible");
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

      currentPhoto = canvas.toDataURL("image/jpeg", 0.65);
      $("preview").src = currentPhoto;
      $("preview").classList.remove("hidden");
      $("message").textContent = "Photo prête à être enregistrée.";
    } catch (error) {
      $("message").textContent = "Impossible de préparer cette photo. Essayez une autre image.";
    }
  })();
});

form.addEventListener("submit", async e => {
  e.preventDefault();
  await photoProcessing;

  const id = $("editId").value;
  const old = students.find(s => s.id === id);

  const student = {
    id: id || (Date.now().toString() + Math.random().toString(16).slice(2)),
    firstName: $("firstName").value.trim(),
    lastName: $("lastName").value.trim(),
    room: $("room").value.trim(),
    building: $("building").value.trim(),
    photo: currentPhoto || (old ? old.photo : "")
  };

  if (!student.firstName || !student.lastName || !student.room) {
    $("message").textContent = "Veuillez remplir les champs obligatoires.";
    return;
  }

  if (students.some(s => s.id !== id &&
      s.firstName.toLocaleLowerCase("fr") === student.firstName.toLocaleLowerCase("fr") &&
      s.lastName.toLocaleLowerCase("fr") === student.lastName.toLocaleLowerCase("fr") &&
      s.room.toLocaleLowerCase("fr") === student.room.toLocaleLowerCase("fr"))) {
    $("message").textContent = "Cet étudiant figure déjà dans cette chambre.";
    return;
  }

  const previous = students.slice();

  if (id) {
    students = students.map(s => s.id === id ? student : s);
  } else {
    students.push(student);
  }

  if (!save()) {
    students = previous;
    return;
  }

  resetForm();
  $("message").textContent = "Étudiant enregistré avec succès.";
  render();
});

function editStudent(id) {
  const s = students.find(s => s.id === id);
  if (!s) return;

  $("editId").value = s.id;
  $("firstName").value = s.firstName;
  $("lastName").value = s.lastName;
  $("room").value = s.room;
  $("building").value = s.building || "";
  currentPhoto = s.photo || "";

  if (currentPhoto) {
    $("preview").src = currentPhoto;
    $("preview").classList.remove("hidden");
  } else {
    $("preview").classList.add("hidden");
  }

  $("formTitle").textContent = "Modifier un étudiant";
  $("cancelEdit").classList.remove("hidden");
  $("formTitle").scrollIntoView({behavior:"smooth"});
}

function deleteStudent(id) {
  const s = students.find(s => s.id === id);
  if (!s || !confirm("Supprimer " + s.firstName + " " + s.lastName + " ?")) return;

  const previous = students.slice();
  students = students.filter(s => s.id !== id);

  if (!save()) {
    students = previous;
    return;
  }

  $("message").textContent = "Étudiant supprimé.";
  render();
}

$("cancelEdit").addEventListener("click", resetForm);
$("search").addEventListener("input", render);

$("exportBtn").addEventListener("click", () => {
  const blob = new Blob([JSON.stringify(students, null, 2)], {
    type: "application/json"
  });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "insea-residents-backup.json";
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
});

render();
</script>
</body>
</html>
